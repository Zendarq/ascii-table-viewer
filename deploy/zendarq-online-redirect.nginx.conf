server {
    listen 80;
    server_name zendarq.online www.zendarq.online;
    return 301 https://asciitable.zendarq.online$request_uri;
}

server {
    listen 443 ssl;
    server_name zendarq.online www.zendarq.online;

    ssl_certificate /etc/letsencrypt/live/zendarq.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zendarq.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://asciitable.zendarq.online$request_uri;
}
